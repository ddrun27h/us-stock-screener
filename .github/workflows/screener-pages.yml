name: Publish public screener

# Runs from the PUBLIC repo (free Actions minutes). Source is checked out from the private repo with a
# read-only deploy key (environment secret SOURCE_READ_KEY). Logs here are public: keep them quiet.

on:
  schedule:
    # UTC crons = 06:00 / 12:30 / 19:00 Asia/Taipei (UTC+8, no DST)
    - cron: "0 22 * * *"
    - cron: "30 4 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      ui_only:
        description: "UI only: rebuild the web bundle and republish it with the live site's data files unchanged (no scan, no AI, no data regeneration)"
        type: boolean
        default: false

concurrency:
  group: screener-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: scanner
    permissions:
      contents: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ddrun27h/us-stock-monitor
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Enable 4 GB swap
        if: ${{ inputs.ui_only != true }}
        continue-on-error: true
        run: |
          if swapon --show=NAME --noheadings | grep -qx /swapfile; then
            echo "swap /swapfile already active"
          else
            [ -f /swapfile ] || sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || echo "swapon failed; continuing without extra swap"
          fi
          swapon --show || true
          free -h || true

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Restore bar data cache
        if: ${{ inputs.ui_only != true }}
        id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/cache
            data/screener-ci.db
            data/screener-ci.db-wal
            data/screener-ci.db-shm
          key: screener-bars-${{ github.run_id }}
          restore-keys: |
            screener-bars-

      - name: Install
        run: npm ci

      - name: Fetch previous public output
        run: |
          set -e
          if git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages | grep -q "refs/heads/gh-pages"; then
            git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" .prev-site
          else
            echo "no previous gh-pages branch"
          fi

      - name: Scan and export
        if: ${{ inputs.ui_only != true }}
        id: export
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_OPTIONS: --max-http-header-size=65536
          BASIC_AUTH: "off"
          DATABASE_PATH: ${{ github.workspace }}/data/screener-ci.db
          DAILY_BARS_PROVIDER: yahoo-filtered
          YAHOO_SCAN_CONCURRENCY: "1"
          YAHOO_SCAN_MIN_DELAY_MS: "500"
        run: |
          REUSE=""
          if [ -f "$GITHUB_WORKSPACE/.prev-site/data/scan.json" ]; then
            REUSE="--reuse $GITHUB_WORKSPACE/.prev-site/data/scan.json"
          fi
          npm run export:screener -- $REUSE --out "$GITHUB_WORKSPACE/packages/web/public/data/scan.json"

      - name: Save bar data cache
        if: steps.export.outputs.ran_full == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/cache
            data/screener-ci.db
            data/screener-ci.db-wal
            data/screener-ci.db-shm
          key: screener-bars-${{ github.run_id }}

      - name: Build static site
        if: steps.export.outputs.ran_full == 'true' || inputs.ui_only == true
        env:
          VITE_PUBLIC_SCREENER: "1"
          VITE_BASE: /us-stock-screener/
        run: npm run build -w @us-stock-monitor/web

      - name: Publish to public repo
        env:
          UI_ONLY: ${{ inputs.ui_only == true && 'true' || 'false' }}
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RAN_FULL="${{ steps.export.outputs.ran_full }}"
          if [ "$UI_ONLY" = "true" ]; then
            # UI-only: new bundle + the live site's data files, byte for byte. Fail instead of publishing if anything is off.
            fail() { echo "::error::ui_only: $1"; exit 1; }
            PUB=packages/web/dist
            test -d .prev-site/.git || fail "live gh-pages checkout missing"
            test -d .prev-site/data || fail "live data/ missing"
            test -f "$PUB/index.html" || fail "bundle not built"
            N_LIVE=$(find .prev-site/data -type f | wc -l)
            [ "$N_LIVE" -ge 1 ] || fail "live data/ has no files"
            [ -z "$(find .prev-site/data -type f -empty)" ] || fail "live data/ has empty files"
            test -s .prev-site/data/scan.json || fail "live data/scan.json missing or empty"
            node -e 'const d=JSON.parse(require("fs").readFileSync(".prev-site/data/scan.json","utf8")); if(!Array.isArray(d.items)) process.exit(1); console.log(`live scan.json: completedAt=${d.completedAt} scanDate=${d.scanDate} items=${d.items.length}`)' || fail "live scan.json is not valid"
            rm -rf "$PUB/data"
            mkdir -p "$PUB/data"
            cp -a .prev-site/data/. "$PUB/data/"
            touch "$PUB/.nojekyll"
            rm -rf .publish
            cp -a .prev-site .publish
            find .publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$PUB"/. .publish/
            (cd .prev-site/data && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/live-data.sha"
            (cd .publish/data && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/pub-data.sha"
            cmp -s "$RUNNER_TEMP/live-data.sha" "$RUNNER_TEMP/pub-data.sha" || fail "data files differ from the live site"
            [ "$(find .publish/data -type f | wc -l)" = "$N_LIVE" ] || fail "data file count differs from the live site"
            git -C .publish add -A
            [ -z "$(git -C .publish diff --cached --name-only -- data/)" ] || fail "git sees changes under data/"
            echo "ui_only: $N_LIVE data file(s) identical to the live site"
          elif [ "$RAN_FULL" != "true" ]; then
            test -d .prev-site/.git
            test -f packages/web/public/data/scan.json
            rm -rf .publish
            cp -a .prev-site .publish
            mkdir -p .publish/data
            cp -a packages/web/public/data/scan.json .publish/data/scan.json
          else
            PUB=packages/web/dist
            test -f "$PUB/index.html"
            test -f "$PUB/data/scan.json"
            touch "$PUB/.nojekyll"
            if [ -d .prev-site/.git ]; then
              rm -rf .publish
              cp -a .prev-site .publish
              find .publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              cp -a "$PUB"/. .publish/
            else
              mkdir -p .publish
              cp -a "$PUB"/. .publish/
              git -C .publish init -b gh-pages
            fi
          fi
          git -C .publish config user.name "github-actions"
          git -C .publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .publish add -A
          if git -C .publish diff --cached --quiet; then
            echo "no site changes"
          else
            git -C .publish commit -m "Publish screener $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git -C .publish remote remove origin 2>/dev/null || true
          git -C .publish remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git -C .publish push -u origin gh-pages
